# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# truecolor
set -g default-terminal 'tmux-256color'
set -as terminal-features 'xterm*:RGB'

# forward focus in/out events to apps (vim, claude code)
set -g focus-events on

# copy to system clipboard via OSC 52
set -g set-clipboard on

# Shared status bar; machine-colors.conf may override @machine-color.
set -g @machine-color 'colour75'
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=colour250,bg=colour235'
set -g status-left '#[fg=#101018,bg=#{@machine-color},bold] #h #[default] #[fg=colour245]#S  '
set -g status-left-length 40
set -g status-right '#[fg=colour245]%H:%M '
set -g status-right-length 10
set -g window-status-separator ' '
set -g window-status-style 'fg=colour245,bg=colour235'
set -g window-status-current-style 'fg=#{@machine-color},bg=colour238,bold'
set -g window-status-format ' #I #W#{?window_zoomed_flag, [zoom],}#{?window_bell_flag, !,}#{?window_activity_flag, +,} '
set -g window-status-current-format ' #I #W#{?window_zoomed_flag, [zoom],}#{?window_bell_flag, !,}#{?window_activity_flag, +,} '
set -g pane-active-border-style 'fg=#{@machine-color}'

# fixes

# https://github.com/anthropics/claude-code/issues/6072
# https://code.claude.com/docs/fr/terminal-config#configure-tmux
set -g allow-passthrough on
set -g extended-keys always
set -as terminal-features 'xterm*:extkeys'
